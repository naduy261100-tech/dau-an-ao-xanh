name: Verify deployed live camera preview correction

on:
  push:
    branches:
      - fix/live-camera-match-preview-20261109
    paths:
      - .github/workflows/verify-camera-preview-live.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check live HTML, original 20/11 background and camera script
        shell: bash
        run: |
          set -euo pipefail
          base="https://dau-an-ao-xanh.naduy261100.workers.dev"
          curl -fsSL "$base/" -o "$RUNNER_TEMP/home.html"
          grep -q "Góc tri ân thầy cô" "$RUNNER_TEMP/home.html"
          grep -q 'src="/assets/app.js?v=20261109-camera-preview-match"' "$RUNNER_TEMP/home.html"
          echo "HOMEPAGE=200 SECTION_20_11=present"
          asset_status="$(curl -sS -L -o "$RUNNER_TEMP/teacher-day.webp" -w "%{http_code}" "$base/assets/teacher-day-20-11.webp")"
          echo "TEACHER_DAY_ASSET_STATUS=$asset_status MIME=$(file --brief --mime-type "$RUNNER_TEMP/teacher-day.webp") BYTES=$(wc -c < "$RUNNER_TEMP/teacher-day.webp")"
          test "$asset_status" = "200"
          test "$(file --brief --mime-type "$RUNNER_TEMP/teacher-day.webp")" = "image/webp"
          test "$(wc -c < "$RUNNER_TEMP/teacher-day.webp")" -gt 50000
          curl -fsSL "$base/assets/app.js?v=20261109-camera-preview-match" -o "$RUNNER_TEMP/app.js"
          grep -q "requestVideoFrameCallback" "$RUNNER_TEMP/app.js"
          grep -q "previewAspect = 3 / 4" "$RUNNER_TEMP/app.js"
          grep -q "captureLivePhoto" "$RUNNER_TEMP/app.js"
          grep -q "warmMattingModel" "$RUNNER_TEMP/app.js"
          grep -q "harmonizeSubject" "$RUNNER_TEMP/app.js"
          grep -q "teacher-day-20-11" "$RUNNER_TEMP/app.js"
          echo "CAMERA_SCRIPT=200 FRESH_DECODED_FRAME=present PREVIEW_CROP_3x4=present MATTE_WARMUP=present LIGHT_MATCH=present"
