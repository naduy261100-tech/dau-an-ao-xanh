name: Verify deployed live camera preview correction

on:
  push:
    branches:
      - fix/live-camera-match-preview-20261109
    paths:
      - .github/workflows/verify-camera-preview-live.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Allow automatic production deployment to propagate
        run: sleep 45
      - name: Check live HTML, 20 November background and camera script
        shell: bash
        run: |
          set -u
          base="https://dau-an-ao-xanh.naduy261100.workers.dev"
          curl -sS -L -D "$RUNNER_TEMP/home.headers" -o "$RUNNER_TEMP/home.html" "$base/" || true
          echo "HOME_STATUS=$(head -1 "$RUNNER_TEMP/home.headers" | tr -d '\r')"
          echo "HOME_SCRIPT_TAGS:"
          grep -oE '<script[^>]+src="[^"]+"' "$RUNNER_TEMP/home.html" || true
          grep -qi "Góc tri ân thầy cô" "$RUNNER_TEMP/home.html" && echo "TEACHER_DAY_SECTION=present" || echo "TEACHER_DAY_SECTION=missing"
          grep -q 'src="/assets/app.js?v=20261109-camera-preview-match"' "$RUNNER_TEMP/home.html" && echo "CAMERA_CACHE_BUSTER=present" || echo "CAMERA_CACHE_BUSTER=missing"
          asset_status="$(curl -sS -L -o "$RUNNER_TEMP/teacher-day.webp" -w "%{http_code}" "$base/assets/teacher-day-20-11.webp")"
          echo "TEACHER_DAY_ASSET_STATUS=$asset_status MIME=$(file --brief --mime-type "$RUNNER_TEMP/teacher-day.webp") BYTES=$(wc -c < "$RUNNER_TEMP/teacher-day.webp")"
          js_status="$(curl -sS -L -o "$RUNNER_TEMP/app.js" -w "%{http_code}" "$base/assets/app.js?v=20261109-camera-preview-match")"
          echo "APP_JS_STATUS=$js_status"
          for marker in requestVideoFrameCallback "previewAspect = 3 / 4" captureLivePhoto warmMattingModel harmonizeSubject teacher-day-20-11; do
            if grep -Fq "$marker" "$RUNNER_TEMP/app.js"; then echo "JS_MARKER_PRESENT=$marker"; else echo "JS_MARKER_MISSING=$marker"; fi
          done
