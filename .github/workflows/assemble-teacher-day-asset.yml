name: Assemble 20 November background asset

on:
  push:
    branches:
      - feature/teacher-day-20-11-special-section
    paths:
      - "public/assets/teacher-day-20-11.trigger"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Rebuild the original WebP image from text-safe segments
        shell: bash
        run: |
          set -euo pipefail
          test -f public/assets/teacher-day-20-11.trigger
          cat public/assets/teacher-day-image-segment-*.txt > "$RUNNER_TEMP/teacher-day.b64"
          base64 --decode "$RUNNER_TEMP/teacher-day.b64" > public/assets/teacher-day-20-11.webp
          test "$(file --brief --mime-type public/assets/teacher-day-20-11.webp)" = "image/webp"
          test "$(wc -c < public/assets/teacher-day-20-11.webp)" -gt 50000
          echo "Recovered image:"
          file public/assets/teacher-day-20-11.webp
          rm public/assets/teacher-day-image-segment-*.txt
          rm public/assets/teacher-day-20-11.trigger

      - name: Commit the binary background asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/teacher-day-20-11.webp public/assets/teacher-day-image-segment-*.txt public/assets/teacher-day-20-11.trigger || true
          git add -f public/assets/teacher-day-20-11.webp
          git commit -m "Add original 20 November check-in background"
          git push origin "HEAD:${GITHUB_REF_NAME}"
