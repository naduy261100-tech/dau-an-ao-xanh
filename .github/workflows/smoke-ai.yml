name: Check AI-created and library backgrounds

on:
  push:
    branches: [main]

jobs:
  smoke:
    if: startsWith(github.event.head_commit.message, '[smoke-ai]')
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare production deployment
        run: sleep 75

      - name: Check all eleven optional library backgrounds
        shell: bash
        run: |
          set -euo pipefail
          scenes=(rice-gold rice-green rice-path village-stone village-road hill-path wood-bridge garden-walk traditional-garden flower-garden waterfall)
          for scene in "${scenes[@]}"; do
            output="$RUNNER_TEMP/library-$scene.jpg"
            headers="$RUNNER_TEMP/library-$scene-headers.txt"
            body="$(jq -cn --arg scene "$scene" '{scene:$scene,mode:"library"}')"
            STATUS="$(curl --silent --show-error -X POST "https://dau-an-ao-xanh.naduy261100.workers.dev/api/background" -H "Content-Type: application/json" --data "$body" -D "$headers" -o "$output" -w "%{http_code}")"
            echo "LIBRARY_SCENE=$scene HTTP_STATUS=$STATUS"
            test "$STATUS" = "200"
            test "$(file --brief --mime-type "$output")" = "image/jpeg"
            test "$(wc -c < "$output")" -gt 10000
          done
          echo "PASS: All eleven optional library scenes return usable JPEG photos."

      - name: Generate a new AI landscape without uploading a person photo
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/generated-ai-background.jpg"
          headers="$RUNNER_TEMP/generated-ai-background-headers.txt"
          body="$(jq -cn '{scene:"wood-bridge",mode:"ai-background",seed:20261104}')"
          STATUS="$(curl --silent --show-error -X POST "https://dau-an-ao-xanh.naduy261100.workers.dev/api/background" -H "Content-Type: application/json" --data "$body" -D "$headers" -o "$output" -w "%{http_code}")"
          echo "AI_BACKGROUND_HTTP_STATUS=$STATUS"
          if [ "$STATUS" != "200" ]; then
            cat "$output"
            exit 1
          fi
          MIME="$(file --brief --mime-type "$output")"
          SIZE="$(wc -c < "$output")"
          SOURCE="$(grep -i '^x-background-source:' "$headers" | tail -1 | tr -d '\r' | awk -F': ' '{print $2}' || true)"
          MODEL="$(grep -i '^x-background-model:' "$headers" | tail -1 | tr -d '\r' | awk -F': ' '{print $2}' || true)"
          echo "AI_BACKGROUND_CONTENT_TYPE=$MIME BYTES=$SIZE SOURCE=$SOURCE MODEL=$MODEL"
          echo "--- response headers ---"
          cat "$headers"
          test "$MIME" = "image/jpeg"
          test "$SIZE" -gt 10000
          test "$SOURCE" = "flux-ai"
          test "$MODEL" = "FLUX.2-Klein-4B"
          echo "PASS: FLUX.2 Klein 4B generated a fresh high-detail background; no personal photo was uploaded."

      - name: Save AI background sample for visual review
        uses: actions/upload-artifact@v4
        with:
          name: ai-generated-background-sample
          path: ${{ runner.temp }}/generated-ai-background.jpg
          retention-days: 1
