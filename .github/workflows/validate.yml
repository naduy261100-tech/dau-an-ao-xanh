name: Validate check-in site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser JavaScript
        run: node --check assets/app.js
      - name: Check Pages Functions
        run: |
          node --check functions/api/health.js
          node --check functions/api/process.js
      - name: Validate Pages routes JSON
        run: python -m json.tool _routes.json > /dev/null
      - name: Check required Pages files
        run: |
          test -f index.html
          test -f privacy.html
          test -f assets/styles.css
