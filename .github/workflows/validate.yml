name: Validate check-in site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser JavaScript
        run: node --check public/assets/app.js
      - name: Check Worker and API modules
        run: |
          node --check src/index.js
          node --check functions/api/health.js
          node --check functions/api/background.js
      - name: Check Wrangler configuration
        run: |
          grep -q 'main = "src/index.js"' wrangler.toml
          grep -q 'binding = "AI"' wrangler.toml
      - name: Check required public files
        run: |
          test -f public/index.html
          test -f public/privacy.html
          test -f public/assets/styles.css
