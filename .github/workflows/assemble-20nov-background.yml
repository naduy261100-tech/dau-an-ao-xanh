name: Assemble original 20 November backdrop

on:
  push:
    branches:
      - fix/camera-fresh-frame-20-11-20261109
    paths:
      - public/assets/teacher-day-asset.trigger

permissions:
  contents: write

jobs:
  assemble-background:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Rebuild and verify the original WebP background
        shell: bash
        run: |
          set -euo pipefail
          cat public/assets/teacher-day-part-*.b64 > "$RUNNER_TEMP/teacher-day.b64"
          base64 --decode "$RUNNER_TEMP/teacher-day.b64" > public/assets/teacher-day-20-11.webp
          test "$(file --brief --mime-type public/assets/teacher-day-20-11.webp)" = "image/webp"
          test "$(wc -c < public/assets/teacher-day-20-11.webp)" -gt 50000
          file public/assets/teacher-day-20-11.webp
      - name: Keep only the binary image in the published site
        shell: bash
        run: |
          set -euo pipefail
          rm public/assets/teacher-day-part-*.b64
          rm public/assets/teacher-day-asset.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/assets
          git commit -m "Add original Minh Khuong 20 November background"
          git push origin "HEAD:${GITHUB_REF_NAME}"
